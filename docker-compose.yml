# muckscraperHeadlinesGoogleNEW/docker-compose.yml
services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${MUCKSCRAPER_RUNTIME_ROOT:?MUCKSCRAPER_RUNTIME_ROOT must be set by Sandbox Protocol}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
    volumes:
      - ${MUCKSCRAPER_RUNTIME_ROOT:?MUCKSCRAPER_RUNTIME_ROOT must be set by Sandbox Protocol}/meilisearch:/meili_data
    restart: unless-stopped

  # Holds the Docker socket so the admin app never has to -- exposes only
  # container-list/restart over an internal-only HTTP API. See
  # docker_restart_proxy/app.py for exactly what's reachable.
  docker-restart-proxy:
    build:
      context: ./docker_restart_proxy
    volumes:
      - ${MUCKSCRAPER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      COMPOSE_PROJECT_NAME: muckscraper
    restart: unless-stopped

  # Every fresh Compose/Sandbox lifecycle initializes the database before API
  # or scheduler containers can run. The operation is idempotent: it creates
  # missing schema/defaults and otherwise verifies the current schema state.
  database-bootstrap:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # The app image's default boot.sh entrypoint launches Gunicorn. Override it
    # so this one-shot service actually runs the schema/default bootstrap.
    entrypoint: []
    command: ["python", "bootstrap_database.py"]
    environment:
      FLASK_APP: aggregator.app
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"
    volumes:
      - .:/app

  scheduler:
    build:
      context: .
      dockerfile: news_fetcher/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
    command: sh -c "sleep 15 && python -m news_fetcher.scheduler"
    environment:
      FLASK_APP: aggregator.app
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEWS_API_KEY: ${NEWS_API_KEY:?NEWS_API_KEY must be set in the sandbox secrets file}
      GNEWS_API_KEY: ${GNEWS_API_KEY:?GNEWS_API_KEY must be set in the sandbox secrets file}
      # The shared Ollama service owns model storage and is reachable only on
      # the dedicated internal agent-services Docker network.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_FALLBACK_HOST: ""
      OLLAMA_PRIMARY_RECHECK_SECONDS: "60"
      LLM_PROVIDER: ollama
      LLM_FAST_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_FAST_MODEL: qwen2.5:1.5b-instruct
      EMBEDDING_MODEL: nomic-embed-text:v1.5
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_FETCH_REPORT_WEBHOOK_URL: ${N8N_FETCH_REPORT_WEBHOOK_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      default:
      agent-services:

  app:
    build: .
    container_name: muckscraper
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      docker-restart-proxy:
        condition: service_started
    environment:
      FLASK_APP: aggregator.app
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      SECRET_KEY: ${SECRET_KEY}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      PUBLIC_READ_ACCESS: ${PUBLIC_READ_ACCESS:-false}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEWS_API_KEY: ${NEWS_API_KEY:?NEWS_API_KEY must be set in the sandbox secrets file}
      GNEWS_API_KEY: ${GNEWS_API_KEY:?GNEWS_API_KEY must be set in the sandbox secrets file}
      # The app is also an execution surface for target-scoped Sandbox
      # commands, including the bounded smoke run. Keep its shared-model policy
      # in sync with the scheduler so those commands can use local inference.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_FALLBACK_HOST: ""
      OLLAMA_PRIMARY_RECHECK_SECONDS: "60"
      LLM_PROVIDER: ollama
      LLM_FAST_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_FAST_MODEL: qwen2.5:1.5b-instruct
      EMBEDDING_MODEL: nomic-embed-text:v1.5
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_FETCH_REPORT_WEBHOOK_URL: ${N8N_FETCH_REPORT_WEBHOOK_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
      DOCKER_RESTART_PROXY_URL: http://docker-restart-proxy:5001
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      default:
      agent-services:

networks:
  default:
    name: app-network
  agent-services:
    name: agent-services
    external: true
